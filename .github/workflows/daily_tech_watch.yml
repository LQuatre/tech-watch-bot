name: Daily AI Tech Watch

on:
  # Déclenchement instantané (2s) via cron-job.org à 07h50 pile ou bouton manuel
  # (Le schedule natif GitHub a été retiré car il subissait 8h à 12h de retard)
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - test_gemini_only

jobs:
  run-tech-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la veille (ou le test modèle Gemini)
        env:
          PYTHONUNBUFFERED: "1"
          RUN_MODE: ${{ inputs.mode || 'full' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u main.py
