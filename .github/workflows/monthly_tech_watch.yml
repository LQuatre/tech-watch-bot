name: Monthly AI Tech Retrospective

on:
  schedule:
    # Déclenchement automatique le 1er jour de chaque mois à 07:00 UTC
    - cron: '0 7 1 * *'
  # Déclenchement manuel pour tester quand tu veux
  workflow_dispatch:

jobs:
  run-monthly-retrospective:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la rétrospective mensuelle
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python monthly.py
