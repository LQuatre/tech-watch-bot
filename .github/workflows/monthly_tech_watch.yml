name: Monthly AI Tech Retrospective

on:
  # Déclenchement instantané via cron-job.org le 1er du mois à 07h50 pile ou bouton manuel
  workflow_dispatch:

jobs:
  run-monthly-retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la rétrospective mensuelle
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u monthly.py
